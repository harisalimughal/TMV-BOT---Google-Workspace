name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      # Also asserts the per-interaction Google API call budget, so the 40-call
      # photo path cannot be silently reintroduced.
      - run: npm run verify
